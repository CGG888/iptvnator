name: docker-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version tag (e.g., 0.17.3)'
        required: true
        type: string
      latest:
        description: 'Also tag and push "latest"'
        required: false
        default: 'true'
        type: boolean
      platforms:
        description: 'Target platforms (comma separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compose image tags
        id: tags
        shell: bash
        run: |
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          # ensure lowercase for Docker Hub namespace
          REPO="${USERNAME,,}/iptvnator"
          EVENT_NAME="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          RAW_TAG=""

          if [ "$EVENT_NAME" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
            V="${RAW_TAG#v}"
          elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            RAW_TAG="$REF_NAME"
            V="${RAW_TAG#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="$(node -p "require('./package.json').version")"
          fi

          LATEST_INPUT="${{ inputs.latest }}"
          if [ -z "$LATEST_INPUT" ]; then
            LATEST_INPUT="true"
          fi
          {
            echo "tags<<EOF"
            echo "${REPO}:${V}"
            if [ "$LATEST_INPUT" = "true" ]; then
              echo "${REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ inputs.platforms != '' && inputs.platforms || 'linux/amd64,linux/arm64' }}
