name: docker-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version tag (e.g., 0.17.3)'
        required: true
        type: string
      latest:
        description: 'Also tag and push "latest"'
        required: false
        default: 'true'
        type: boolean
      platforms:
        description: 'Target platforms (comma separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compose image tags
        id: tags
        shell: bash
        run: |
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          # ensure lowercase for Docker Hub namespace
          REPO="${USERNAME,,}/iptvnator"
          V="${{ inputs.version }}"
          {
            echo "tags<<EOF"
            echo "${REPO}:${V}"
            if [ "${{ inputs.latest }}" = "true" ]; then
              echo "${REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ inputs.platforms != '' && inputs.platforms || 'linux/amd64,linux/arm64' }}
