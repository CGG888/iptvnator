name: Release
on:
  push:
    branches:
      - electron
    paths:
      - 'package.json'
  workflow_dispatch:
jobs:
  check_version:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect version change
        id: diff
        shell: bash
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git show "${{ github.event.before }}:package.json" > /tmp/old_pkg.json || true
          fi
          if [ -s /tmp/old_pkg.json ]; then
            OLD_VERSION=$(node -e "const fs=require('fs'); const s=fs.readFileSync('/tmp/old_pkg.json','utf8'); try{console.log(JSON.parse(s).version)}catch(e){console.log('')}")
          else
            OLD_VERSION=""
          fi
          echo "New: $NEW_VERSION, Old: $OLD_VERSION"
          if [ -n "$OLD_VERSION" ] && [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  package:
    runs-on: ${{ matrix.os }}
    needs: check_version
    if: needs.check_version.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3
        # Only install Snapcraft on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
      
      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          npm ci
          npm run build
          PUB="never"
          if [ -n "${SNAPCRAFT_STORE_CREDENTIALS}" ]; then
            PUB="always"
          fi
          echo "Snap publish mode: $PUB"
          npx electron-builder --linux snap --armv7l --publish "$PUB"
          npx electron-builder --linux snap --x64 --publish "$PUB"
          npx electron-builder --linux deb rpm --x64 --publish always
          npx electron-builder --linux deb --arm64 --publish always
          npx electron-builder --linux deb --armv7l --publish always
          npx electron-builder --linux AppImage --x64 --publish always
          npx electron-builder --linux AppImage --arm64 --publish always
          npx electron-builder --linux AppImage --armv7l --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Electron app - MacOS
        uses: Yan-Jobs/action-electron-builder@v1.7.0
        if: startsWith(matrix.os, 'macos')
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Release Electron app - Windows
        uses: samuelmeuli/action-electron-builder@v1
        if: startsWith(matrix.os, 'windows')
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
