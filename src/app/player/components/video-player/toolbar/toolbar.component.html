<mat-toolbar color="primary">
    <button
        mat-icon-button
        (click)="toggleLeftDrawerClicked.emit()"
        [matTooltip]="'TOP_MENU.OPEN_CHANNELS_LIST' | translate"
        class="sidenav-toggle-button"
    >
        <mat-icon>menu</mat-icon>
    </button>
    <button
        *ngIf="(playlistId$ | async) !== 'GLOBAL_FAVORITES'"
        mat-icon-button
        (click)="addToFavorites(activeChannel)"
        [matTooltip]="'TOP_MENU.TOGGLE_FAVORITE_FLAG' | translate"
    >
        <mat-icon>
            {{
                (favorites$ | async).includes(activeChannel?.id)
                    ? 'star'
                    : 'star_outline'
            }}</mat-icon
        >
    </button>
    {{ activeChannel?.name }}
    <div class="spacer"></div>
    <!-- Timeshift slider moved into info-overlay to prevent toolbar crowding -->
    <div *ngIf="timeshiftEnabled" style="display:flex; gap:2px; align-items:center; margin-left:8px">
        <button mat-icon-button [matTooltip]="nativeControls ? '隐藏原生控件' : '显示原生控件'" (click)="toggleNativeControls.emit()">
            <mat-icon>{{ nativeControls ? 'cancel_presentation' : 'smart_display' }}</mat-icon>
        </button>
        <button *ngIf="timeshiftEnabled" mat-icon-button [matTooltip]="'返回直播 (LIVE)'" (click)="goLive()">
            <mat-icon>fiber_manual_record</mat-icon>
        </button>
        <button *ngIf="timeshiftEnabled && programStartOffsetSec > 0" mat-icon-button [matTooltip]="'跳到节目起点'" (click)="jumpTo(programStartOffsetSec)">
            <mat-icon>skip_previous</mat-icon>
        </button>
        <button *ngIf="timeshiftEnabled && programNextOffsetSec > 0" mat-icon-button [matTooltip]="'跳到下一节目'" (click)="jumpTo(programNextOffsetSec)">
            <mat-icon>skip_next</mat-icon>
        </button>
    </div>
    <button
        mat-icon-button
        [matMenuTriggerFor]="sourceMenu"
        [matTooltip]="'TOP_MENU.SWITCH_SOURCE' | translate"
        *ngIf="getAlternativeSources().length > 1"
    >
        <mat-icon>swap_horiz</mat-icon>
    </button>
    <mat-menu #sourceMenu="matMenu">
        <button
            mat-menu-item
            *ngFor="let src of getAlternativeSources()"
            (click)="switchSource(src)"
        >
            <mat-icon *ngIf="src.url === activeChannel?.url">radio_button_checked</mat-icon>
            <mat-icon *ngIf="src.url !== activeChannel?.url">radio_button_unchecked</mat-icon>
            <span>{{ sourceLabel(src) }}</span>
        </button>
    </mat-menu>
    <button
        mat-icon-button
        (click)="multiEpgClicked.emit()"
        [matTooltip]="'TOP_MENU.OPEN_MULTI_EPG' | translate"
    >
        <mat-icon>view_list</mat-icon>
    </button>
    <button
        mat-button
        (click)="toggleRightDrawerClicked.emit()"
        [matTooltip]="'TOP_MENU.OPEN_EPG_LIST' | translate"
    >
        EPG
    </button>
</mat-toolbar>
